{# Drawing control buttons block - import where toolbar is required #}
<div class="drawing-controls" role="toolbar" aria-label="Drawing controls">
    <button
        class="drawing-btn"
        type="button"
        data-mode="cursor"
        data-state="active"
        aria-pressed="true"
        title="Toggle cursor mode">
        <span class="drawing-btn__icon" aria-hidden="true">➤</span>
        <span class="drawing-btn__label">Cursor</span>
    </button>
    <button
        class="drawing-btn"
        type="button"
        data-mode="points"
        data-state="inactive"
        aria-pressed="false"
        title="Draw points">
        <span class="drawing-btn__icon" aria-hidden="true">•</span>
        <span class="drawing-btn__label">Point</span>
    </button>
    <button
        class="drawing-btn"
        type="button"
        data-mode="segments"
        data-state="inactive"
        aria-pressed="false"
        title="Draw segments">
        <span class="drawing-btn__icon" aria-hidden="true">━</span>
        <span class="drawing-btn__label">PLine</span>
    </button>
    <div class="drawing-controls__arc-dropdown" data-arc-dropdown>
        <button
            class="drawing-btn drawing-btn--dropdown-trigger"
            type="button"
            data-mode="arc-dropdown"
            data-state="inactive"
            aria-expanded="false"
            aria-haspopup="true"
            title="Arc tools">
            <span class="drawing-btn__icon" aria-hidden="true">⌒</span>
            <span class="drawing-btn__label">Arc</span>
            <span class="drawing-btn__chevron" aria-hidden="true">▼</span>
        </button>
        <div class="drawing-controls__arc-menu" role="menu" hidden>
            <button type="button" class="drawing-btn drawing-controls__arc-menu-btn" data-mode="arc-three-points" role="menuitem" title="Arc by three points"><span class="drawing-btn__icon" aria-hidden="true">••⌒</span></button>
            <button type="button" class="drawing-btn drawing-controls__arc-menu-btn" data-mode="arc-tangent" role="menuitem" title="Arc by tangent"><span class="drawing-btn__icon" aria-hidden="true">⌒╲</span></button>
            <button type="button" class="drawing-btn drawing-controls__arc-menu-btn" data-mode="arc-fillet" role="menuitem" title="Fillet two segments"><span class="drawing-btn__icon" aria-hidden="true">∟⌒</span></button>
        </div>
    </div>
    <button
        class="drawing-btn"
        type="button"
        data-mode="offset"
        data-state="inactive"
        aria-pressed="false"
        title="Offset geometries">
        <span class="drawing-btn__icon" aria-hidden="true">↔</span>
        <span class="drawing-btn__label">Offset</span>
    </button>
    <button
        class="drawing-btn"
        type="button"
        data-mode="snap"
        data-state="inactive"
        aria-pressed="false"
        title="Toggle snap (magnet)">
        <span class="drawing-btn__icon" aria-hidden="true">🧲</span>
        <span class="drawing-btn__label">Snap</span>
    </button>
    <button
        class="drawing-btn"
        type="button"
        data-mode="polygon-select"
        data-state="inactive"
        aria-pressed="false"
        title="Select by polygon">
        <span class="drawing-btn__icon" aria-hidden="true">⬟</span>
        <span class="drawing-btn__label">Polygon</span>
    </button>
    <button
        class="drawing-btn"
        type="button"
        data-mode="undo"
        data-state="inactive"
        aria-pressed="false"
        title="Undo last action">
        <span class="drawing-btn__icon" aria-hidden="true">↶</span>
        <span class="drawing-btn__label">Undo</span>
    </button>
    <button
        class="drawing-btn"
        type="button"
        data-mode="redo"
        data-state="inactive"
        aria-pressed="false"
        title="Redo last action">
        <span class="drawing-btn__icon" aria-hidden="true">↷</span>
        <span class="drawing-btn__label">Redo</span>
    </button>
    <button
        class="drawing-btn"
        type="button"
        data-mode="layers"
        data-state="inactive"
        aria-pressed="false"
        title="Manage layers">
        <span class="drawing-btn__icon" aria-hidden="true">☰</span>
        <span class="drawing-btn__label">Layers</span>
    </button>
    <button
        class="drawing-btn"
        type="button"
        data-mode="table"
        data-state="inactive"
        aria-pressed="false"
        title="Open table view">
        <span class="drawing-btn__icon" aria-hidden="true">⊞</span>
        <span class="drawing-btn__label">Table</span>
    </button>
    <button
        class="drawing-btn"
        type="button"
        data-mode="delete"
        data-state="inactive"
        aria-pressed="false"
        title="Delete geometries">
        <span class="drawing-btn__icon" aria-hidden="true">×</span>
        <span class="drawing-btn__label">Del</span>
    </button>
</div>
